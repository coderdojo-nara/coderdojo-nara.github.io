- question: 会場に駐車場はありますか？
  answer: 会場の駐車場はありませんが、近隣にコインパーキングがいくつかあります。<a href="https://www.google.com/maps/search/%E3%82%B3%E3%82%A4%E3%83%B3%E3%83%91%E3%83%BC%E3%82%AD%E3%83%B3%E3%82%B0/@34.6835857,135.8127161,19z" target="_blank" rel="noopener noreferrer">こちらの地図</a>を参考になさってください。地図の左下にある「ふくふく堂」という駄菓子屋さんの向いもGoogle Maps上にはありませんが、コインパーキングです。
- question: 会場で飲食はできますか？
  answer: 会場での飲食は可能です。ただし、においの強いものはご遠慮ください、またゴミは会場で捨てられませんので出たゴミはお持ち帰りください。
